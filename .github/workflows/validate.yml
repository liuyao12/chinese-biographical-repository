name: Validate corpus
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py
      - run: python3 scripts/validate_corpus.py
      - run: python3 scripts/render_corpus.py --check
      - run: python3 -m scripts.reading_catalog --check
      - run: python3 -m scripts.historical_tables validate
      - run: python3 -m unittest discover -s tests -v
