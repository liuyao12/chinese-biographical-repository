<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="assets/locale-init.js"></script><title>連續年表 · 人文</title><link rel="stylesheet" href="assets/profile.css"><link rel="stylesheet" href="assets/i18n.css"><link rel="stylesheet" href="assets/historical-tables.css"></head>
<body>
<header><a class="brand" href="./"><span lang="zh-Hant">人文</span><span>REN-WEN</span></a><nav><a href="./" data-i18n="Text reader · 文">原文閱讀</a><a href="library.html" data-i18n="Browse all biographies">傳記目錄</a><a href="profiles.html" data-i18n="People · 人">人物</a><div class="language-switch" role="group" aria-label="介面語言"><button type="button" data-set-locale="zh-Hant" aria-pressed="true">中文</button><button type="button" data-set-locale="en" aria-pressed="false">English</button></div><a href="shiji.html">史記</a></nav><small data-release-info class="release-info"></small></header>
<main class="tables-main"><h1 data-i18n="Continuous historical tables">連續年表</h1>
<div class="table-controls"><label><span data-i18n="Choose a table">選擇年表</span> <select id="table-select"></select></label><fieldset><legend data-i18n="Time axis">時間軸</legend><button type="button" id="axis-vertical" aria-pressed="true" data-i18n="Vertical · years down">縱向 · 年份向下</button><button type="button" id="axis-horizontal" aria-pressed="false" data-i18n="Horizontal · years across">橫向 · 年份向右</button></fieldset><label><span data-i18n="Jump to Western year">跳至西元年份</span> <select id="year-select"></select></label><label><span data-i18n="Search source cells">搜尋原文</span> <input id="table-search" type="search"></label><button type="button" id="search-next" data-i18n="Next match">下一筆</button><output id="search-status" aria-live="polite"></output></div>
<h2 id="table-title"></h2><p class="note" data-i18n="Scroll through every year without page turns. Select a cell to inspect its source. Axis direction does not change the original text.">全部年列連續捲動，不必翻頁。點擊儲存格查閱出處；時間軸方向不改動原文。</p>
<p class="note" data-i18n="Western years follow the digital transcription’s editorial comparison, at year precision. They are not original Western dates or exact Gregorian date conversions.">西元年份沿用數位轉錄的編者對照，精度為年；不是原書的西元紀年或精確公曆日期換算。</p>
<p id="table-coverage" role="status"></p><nav id="table-source-links" aria-label="資料出處"></nav>
<div id="table-scroll" class="table-scroll" tabindex="0" role="region" aria-label="可連續捲動的年表" data-i18n-aria-label="Scrollable historical table"><div id="table-grid"></div></div>
<details id="table-provenance"><summary data-i18n="Version, original headings and review status">版本、原欄題與覆核狀態</summary><div id="table-source-details"></div></details>
<dialog id="cell-dialog"><form method="dialog"><button data-i18n="Close" aria-label="關閉" type="submit">關閉</button></form><h2 data-i18n="Source cell">來源儲存格</h2><div id="cell-details"></div></dialog>
</main><script type="module" src="assets/table-reader-redirect.js"></script><script type="module" src="assets/i18n.js"></script><script type="module" src="assets/release-info.js"></script>
</body></html>
